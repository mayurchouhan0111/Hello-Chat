name: hello_chat
description: Hello Chat - Real-time Voice Room & Social Entertainment Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────
  flutter_riverpod: ^2.5.1          # Primary state management
  riverpod_annotation: ^2.3.5       # Code generation annotations

  # ── Navigation ──────────────────────────────────────────
  go_router: ^17.2.1                # Declarative routing

  # ── Firebase ────────────────────────────────────────────
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0            # Auth (phone, email, Google, Facebook)
  cloud_firestore: ^4.15.0          # Primary database
  firebase_storage: ^11.6.0         # File/media storage
  firebase_messaging: ^14.7.19      # Push notifications (FCM)
  firebase_database: ^10.4.9        # Realtime DB for live chat
  cloud_functions: ^4.6.0           # Call Cloud Functions
  firebase_app_check: ^0.2.1+17     # Resolve UNAUTHENTICATED errors

  # ── Auth Providers ──────────────────────────────────────
  google_sign_in: ^6.2.1            # Google OAuth
  flutter_facebook_auth: ^6.1.1     # Facebook OAuth

  # ── Voice Streaming ─────────────────────────────────────
  agora_rtc_engine: ^6.3.0          # Agora RTC voice rooms

  # ── Animations & UI ─────────────────────────────────────
  lottie: ^3.1.0                    # Lottie animations for gifts/effects
  svgaplayer_flutter: ^2.1.0         # SVGA animation player
  flutter_animate: ^4.5.0           # Declarative animation toolkit
  tancent_vap: ^1.0.0+1                # VAP animation player (Tencent VAP)

  # ── Images & Media ──────────────────────────────────────
  cached_network_image: ^3.3.1      # Image caching with placeholder
  flutter_cache_manager: ^3.4.1     # Disk caching for animations
  archive: ^3.6.1                   # Zip/ZLib compression for SVGA parser
  image_picker: ^1.0.7              # Profile photo / room cover upload
  # image_cropper: ^5.0.1             # Crop profile photos

  # ── UI Components ───────────────────────────────────────
  flutter_svg: ^2.0.10+1            # SVG support for icons/illustrations
  gap: ^3.0.1                       # Spacing widget (Gap(16))
  audioplayers: ^5.2.1               # Audio playback for game sounds
  pinput: ^5.0.0                    # OTP PIN input field
  country_picker: ^2.0.21           # Country code + flag picker

  # ── Networking & Utils ───────────────────────────────────
  dio: ^5.4.3+1                     # HTTP client (for Agora token server)
  connectivity_plus: ^6.0.2         # Network connectivity status
  # internet_connection_checker: ^1.0.0+1

  # ── Notifications ───────────────────────────────────────
  flutter_local_notifications: ^17.1.2  # Local push notifications
  permission_handler: ^11.3.1           # Runtime permissions

  # ── Deep Links & Sharing ────────────────────────────────
  share_plus: ^10.0.0                # Share room invite links
  # firebase_dynamic_links: ^5.4.0     # Firebase dynamic links for room invites

  # ── Device & Platform ───────────────────────────────────
  flutter_native_splash: ^2.4.0     # Native splash screen (retained for build asset gen)
  wakelock_plus: ^1.2.5             # Keep screen awake while in room

  # ── Fonts (Google Fonts) ─────────────────────────────────
  google_fonts: ^6.2.1
  timeago: ^3.7.1
  carousel_slider: ^5.0.0
  path_provider: ^2.1.4
  like_button: ^2.1.0
  flutter_widget_from_html_core: ^0.14.0
  webview_flutter: ^4.9.0
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  youtube_player_iframe: ^5.1.2
  youtube_explode_dart: ^2.2.2
  file_picker: ^8.0.7
  url_launcher: ^6.2.6
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0        # Generate Riverpod providers
  freezed: ^2.5.2                   # Generate immutable classes
  json_serializable: ^6.7.1         # Generate JSON serialisation

dependency_overrides:
  http: ^1.2.1

flutter:
  uses-material-design: true

  # Custom fonts — Plus Jakarta Sans
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  assets:
    - assets/images/
    - assets/images/leaderboards/
    - assets/images/rocket_reward/
    - assets/images/super/
    - assets/images/cp/
    - assets/Helo chat/
    - assets/images/extracted_badges/
    - assets/images/levels/
    - assets/images/levels_new/
    - assets/icons/
    - assets/animations/lottie/
    - assets/rocket/
    - assets/rocket/rocket_set_svga/
    - assets/rocket/Rocket set SVGA/
    - assets/rocket/VAP/
    - assets/animations/VAP/
    - assets/fonts/
    - assets/stickers/HotCherry-1779517555688/
    - assets/stickers/UtyaDuck-1779516899467/
    - assets/svga/
    - assets/VIP/VIP 1/
    - assets/VIP/VIP 2/VIP 2/
    - assets/VIP/VIP 3/VIP 3/
    - assets/VIP/VIP 4/VIP 4/
    - assets/VIP/VIP 5/VIP 5/
    - assets/VIP/VIP 6/VIP 6/
    - assets/VIP/VIP 7/VIP 7/
    - assets/VIP/VIP 8/VIP 8/
    - assets/SVIP Kit/svip 1/
    - assets/SVIP Kit/svip 2/
    - assets/SVIP Kit/svip 3/
    - assets/SVIP Kit/svip 4/
    - assets/SVIP Kit/svip 5/
    - assets/SVIP Kit/SVIP 6/
    - assets/games/
