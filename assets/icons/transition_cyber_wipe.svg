<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#151A2E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#241442" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="neonGoldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFEAA7" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF9E00" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="neonCyanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="1" />
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Angled Cyber Blade 1 -->
  <path d="M0,0 L320,0 L400,200 L0,200 Z" fill="url(#bladeGrad1)" />
  <line x1="0" y1="200" x2="400" y2="200" stroke="url(#neonGoldBorder)" stroke-width="2.5" />

  <!-- Angled Cyber Blade 2 -->
  <path d="M0,200 L400,200 L320,400 L0,400 Z" fill="url(#bladeGrad1)" />
  <line x1="0" y1="400" x2="320" y2="400" stroke="url(#neonCyanBorder)" stroke-width="2" />

  <!-- Angled Cyber Blade 3 -->
  <path d="M0,400 L320,400 L400,600 L0,600 Z" fill="url(#bladeGrad1)" />
  <line x1="0" y1="600" x2="400" y2="600" stroke="url(#neonGoldBorder)" stroke-width="2.5" />

  <!-- Angled Cyber Blade 4 -->
  <path d="M0,600 L400,600 L300,800 L0,800 Z" fill="url(#bladeGrad1)" />
  <line x1="0" y1="800" x2="300" y2="800" stroke="url(#neonCyanBorder)" stroke-width="2" />
</svg>
