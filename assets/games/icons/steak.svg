<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="steak_meat" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="40%" stop-color="#D92338" />
      <stop offset="75%" stop-color="#8C0D1E" />
      <stop offset="100%" stop-color="#4A000A" />
    </radialGradient>
    <linearGradient id="steak_fat_edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E6" />
      <stop offset="60%" stop-color="#F2DEC2" />
      <stop offset="100%" stop-color="#C7A685" />
    </linearGradient>
    <radialGradient id="steak_bone" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#D9CBB8" />
      <stop offset="100%" stop-color="#9E8D76" />
    </radialGradient>
    <filter id="steak_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="64" cy="108" rx="48" ry="12" fill="#000000" opacity="0.28" filter="url(#steak_shadow)"/>

  <!-- Outer Fat Rim (3D cut depth) -->
  <path d="M 22,78 C 14,56 22,34 46,26 C 74,16 104,26 114,46 C 122,64 114,88 94,98 C 66,110 32,102 22,78 Z" fill="url(#steak_fat_edge)" filter="url(#steak_shadow)" />

  <!-- 3D Cut Thickness Rim -->
  <path d="M 22,78 C 22,86 42,106 66,106 C 90,106 112,88 114,78 C 114,88 94,102 66,102 C 38,102 22,88 22,78 Z" fill="#9E7B5A"/>

  <!-- Rich Raw / Seared Beef Center -->
  <path d="M 28,74 C 22,56 28,38 48,32 C 72,24 98,32 106,50 C 112,66 104,86 86,92 C 62,102 36,94 28,74 Z" fill="url(#steak_meat)" />

  <!-- Marbling Fat Streaks (Glossy White Veins) -->
  <path d="M 44,40 Q 56,48 70,44 Q 84,40 94,48" stroke="#FFEAEA" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 38,58 Q 52,62 66,56 Q 80,52 92,62" stroke="#FFEAEA" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 48,76 Q 64,74 76,82" stroke="#FFEAEA" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- T-Bone Section in Center -->
  <ellipse cx="66" cy="54" rx="8" ry="6" fill="url(#steak_bone)" stroke="#7A6854" stroke-width="1.5"/>
  <ellipse cx="66" cy="54" rx="3.5" ry="2.5" fill="#4A0202" opacity="0.7"/>

  <!-- Juicy Specular Shine -->
  <ellipse cx="46" cy="46" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.75" transform="rotate(-20 46 46)"/>
  <circle cx="88" cy="70" r="3" fill="#FFFFFF" opacity="0.7"/>
</svg>\n