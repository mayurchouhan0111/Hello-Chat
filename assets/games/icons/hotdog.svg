<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="hotdog_bun_grad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE4B5" />
      <stop offset="45%" stop-color="#E8A858" />
      <stop offset="85%" stop-color="#B86A20" />
      <stop offset="100%" stop-color="#7A3D06" />
    </radialGradient>
    <radialGradient id="hotdog_sausage_grad" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="40%" stop-color="#D92828" />
      <stop offset="85%" stop-color="#8C0D0D" />
      <stop offset="100%" stop-color="#4F0505" />
    </radialGradient>
    <linearGradient id="mustard_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF566" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#D49A00" />
    </linearGradient>
    <linearGradient id="hot_badge_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#B30000" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="64" cy="110" rx="46" ry="12" fill="#000000" opacity="0.25" filter="url(#shadow)" />

  <!-- Bottom Bun (3D shaded) -->
  <path d="M 18,72 C 14,84 26,104 64,105 C 102,106 114,86 110,72 C 106,62 94,62 64,62 C 34,62 22,62 18,72 Z" fill="url(#hotdog_bun_grad)" filter="url(#shadow)" />
  <!-- Bun inner rim highlight -->
  <ellipse cx="64" cy="74" rx="42" ry="16" fill="#F8B868" opacity="0.6"/>

  <!-- Grilled Sausage (juicy 3D curve) -->
  <path d="M 12,68 C 8,56 18,46 32,50 L 96,50 C 110,46 120,56 116,68 C 112,80 98,78 64,79 C 30,78 16,80 12,68 Z" fill="url(#hotdog_sausage_grad)" filter="url(#shadow)" />
  
  <!-- Sausage Highlight Sheen -->
  <path d="M 28,54 Q 64,52 100,54" stroke="#FFA3A3" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <ellipse cx="20" cy="62" rx="4" ry="7" fill="#FFA3A3" opacity="0.6" transform="rotate(-15 20 62)"/>

  <!-- Grill marks on sausage -->
  <line x1="42" y1="52" x2="48" y2="70" stroke="#520505" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="62" y1="52" x2="68" y2="72" stroke="#520505" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="82" y1="52" x2="88" y2="70" stroke="#520505" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Mustard Swirl / Zigzag with 3D bevel -->
  <path d="M 24,62 Q 32,50 40,64 T 56,64 T 72,64 T 88,64 T 104,62" fill="none" stroke="#A67800" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 24,61 Q 32,49 40,63 T 56,63 T 72,63 T 88,63 T 104,61" fill="none" stroke="url(#mustard_grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 26,60 Q 32,48 40,62 T 56,62 T 72,62 T 88,62 T 102,60" fill="none" stroke="#FFFFCC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Top Bun Lid Profile / Shadow curve -->
  <path d="M 22,64 C 20,44 40,36 64,36 C 88,36 108,44 106,64 C 98,62 76,64 64,64 C 52,64 30,62 22,64 Z" fill="url(#hotdog_bun_grad)" opacity="0.3"/>

  <!-- Sesame Seeds -->
  <ellipse cx="45" cy="88" rx="2" ry="1.2" fill="#FFF2DC" transform="rotate(-15 45 88)"/>
  <ellipse cx="64" cy="94" rx="2" ry="1.2" fill="#FFF2DC" transform="rotate(5 64 94)"/>
  <ellipse cx="82" cy="89" rx="2" ry="1.2" fill="#FFF2DC" transform="rotate(20 82 89)"/>

  <!-- Floating 'Hot' Badge (matching Reference Image 1) -->
  <g transform="translate(70, 10)">
    <rect x="0" y="0" width="46" height="22" rx="11" fill="url(#hot_badge_grad)" stroke="#FFFFFF" stroke-width="2" filter="url(#shadow)" />
    <!-- Flame / Glow highlight on badge -->
    <path d="M 6,5 Q 23,2 40,5" stroke="#FFA3A3" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <text x="23" y="15.5" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Hot</text>
  </g>
</svg>\n