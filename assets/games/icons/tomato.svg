<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="tomato_body" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="35%" stop-color="#F0182E" />
      <stop offset="75%" stop-color="#AD0518" />
      <stop offset="95%" stop-color="#6B000D" />
      <stop offset="100%" stop-color="#3D0007" />
    </radialGradient>
    <radialGradient id="calyx_grad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7BEB38" />
      <stop offset="60%" stop-color="#34A813" />
      <stop offset="100%" stop-color="#145E03" />
    </radialGradient>
    <filter id="tomato_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="64" cy="112" rx="46" ry="12" fill="#000000" opacity="0.3" filter="url(#tomato_shadow)"/>

  <!-- Plump Glossy 3D Tomato Sphere -->
  <path d="M 20,68 C 16,42 36,26 64,26 C 92,26 112,42 108,68 C 104,96 88,108 64,108 C 40,108 24,96 20,68 Z" fill="url(#tomato_body)" filter="url(#tomato_shadow)"/>

  <!-- 3D Specular Reflection Curve (Glassy Highlights) -->
  <path d="M 34,44 C 42,34 54,32 64,32" stroke="#FFA8A8" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <ellipse cx="44" cy="42" rx="6" ry="4" fill="#FFFFFF" opacity="0.95" transform="rotate(-25 44 42)"/>
  <circle cx="58" cy="36" r="2.5" fill="#FFFFFF" opacity="0.85"/>

  <!-- Subtle Bottom Rim Light -->
  <path d="M 38,98 C 52,104 76,104 90,98" stroke="#FF7A88" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- Green Star Calyx and Stem on Top -->
  <!-- Stem -->
  <path d="M 64,28 C 63,16 68,10 74,6 C 72,10 68,16 66,28 Z" fill="#2E8B0C" filter="url(#tomato_shadow)"/>
  <!-- Calyx 5-leaf crown -->
  <g filter="url(#tomato_shadow)">
    <!-- Top left leaf -->
    <path d="M 64,28 Q 50,22 40,18 Q 48,26 64,30 Z" fill="url(#calyx_grad)"/>
    <!-- Top right leaf -->
    <path d="M 64,28 Q 78,22 88,20 Q 80,27 64,30 Z" fill="url(#calyx_grad)"/>
    <!-- Bottom left leaf -->
    <path d="M 64,30 Q 48,34 38,40 Q 50,38 64,32 Z" fill="url(#calyx_grad)"/>
    <!-- Bottom right leaf -->
    <path d="M 64,30 Q 80,34 90,40 Q 78,38 64,32 Z" fill="url(#calyx_grad)"/>
    <!-- Center front leaf -->
    <path d="M 64,30 Q 64,42 63,46 Q 66,42 66,32 Z" fill="url(#calyx_grad)"/>
    <!-- Calyx center button -->
    <circle cx="64" cy="29" r="4.5" fill="#1B6306"/>
    <circle cx="63" cy="28" r="2" fill="#88FF4D" opacity="0.8"/>
  </g>
</svg>\n