<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="chicken_roast" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFBE6B" />
      <stop offset="35%" stop-color="#E87820" />
      <stop offset="70%" stop-color="#A84408" />
      <stop offset="95%" stop-color="#612000" />
      <stop offset="100%" stop-color="#381000" />
    </radialGradient>
    <radialGradient id="bone_grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#EBE3D5" />
      <stop offset="100%" stop-color="#BDB09B" />
    </radialGradient>
    <filter id="chicken_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="64" cy="108" rx="46" ry="12" fill="#000000" opacity="0.28" filter="url(#chicken_shadow)"/>

  <!-- Bone Handle -->
  <g transform="translate(32, 92) rotate(-35)">
    <!-- Shaft -->
    <rect x="-6" y="-2" width="12" height="24" rx="4" fill="url(#bone_grad)" filter="url(#chicken_shadow)"/>
    <!-- Knobs -->
    <circle cx="-6" cy="20" r="7" fill="url(#bone_grad)"/>
    <circle cx="6" cy="20" r="7" fill="url(#bone_grad)"/>
    <circle cx="-6" cy="18" r="3.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="6" cy="18" r="3.5" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Plump Roast Meat Body (Drumstick bulb) -->
  <path d="M 38,76 C 26,62 30,34 56,20 C 82,6 108,18 116,42 C 124,66 108,90 84,94 C 64,98 48,88 38,76 Z" fill="url(#chicken_roast)" filter="url(#chicken_shadow)" />

  <!-- Delicious Golden Crispy Highlights -->
  <path d="M 52,28 C 72,16 94,22 104,38" stroke="#FFE6A8" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <ellipse cx="78" cy="38" rx="14" ry="8" fill="#FFE6A8" opacity="0.45" transform="rotate(-15 78 38)"/>

  <!-- Crispy texture flecks / herbs -->
  <circle cx="86" cy="56" r="2" fill="#3D1200" opacity="0.6"/>
  <circle cx="68" cy="62" r="2.2" fill="#3D1200" opacity="0.6"/>
  <circle cx="76" cy="74" r="1.8" fill="#3D1200" opacity="0.6"/>
  <circle cx="98" cy="46" r="2" fill="#3D1200" opacity="0.6"/>

  <!-- Glistening Highlights -->
  <ellipse cx="64" cy="36" rx="5" ry="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="92" cy="40" r="3" fill="#FFFFFF" opacity="0.85"/>
</svg>\n