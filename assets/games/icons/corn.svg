<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="corn_kernel" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="45%" stop-color="#FFD700" />
      <stop offset="80%" stop-color="#E69900" />
      <stop offset="100%" stop-color="#995C00" />
    </radialGradient>
    <radialGradient id="corn_husk" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#B8F078" />
      <stop offset="50%" stop-color="#6BBF26" />
      <stop offset="85%" stop-color="#3D820C" />
      <stop offset="100%" stop-color="#235203" />
    </radialGradient>
    <filter id="corn_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="64" cy="112" rx="42" ry="10" fill="#000000" opacity="0.25" filter="url(#corn_shadow)"/>

  <!-- Golden Corn Cob Body -->
  <g transform="translate(18, 22) rotate(-35)" filter="url(#corn_shadow)">
    <!-- Cob backing -->
    <path d="M 16,30 C 16,10 28,0 44,0 C 60,0 72,10 72,30 L 64,88 C 64,96 54,102 44,102 C 34,102 24,96 24,88 Z" fill="url(#corn_kernel)"/>

    <!-- Textured Kernel Rows (individual 3D bumps) -->
    <!-- Row 1 -->
    <circle cx="34" cy="24" r="5" fill="#FFF275"/>
    <circle cx="44" cy="22" r="5.5" fill="#FFF59D"/>
    <circle cx="54" cy="24" r="5" fill="#FFE082"/>
    <!-- Row 2 -->
    <circle cx="28" cy="36" r="5.5" fill="#FFF275"/>
    <circle cx="38" cy="34" r="6" fill="#FFF59D"/>
    <circle cx="49" cy="34" r="6" fill="#FFF275"/>
    <circle cx="59" cy="36" r="5.5" fill="#FFCA28"/>
    <!-- Row 3 -->
    <circle cx="27" cy="48" r="5.5" fill="#FFF275"/>
    <circle cx="38" cy="46" r="6" fill="#FFF59D"/>
    <circle cx="49" cy="46" r="6" fill="#FFF275"/>
    <circle cx="60" cy="48" r="5.5" fill="#FFCA28"/>
    <!-- Row 4 -->
    <circle cx="28" cy="60" r="5.5" fill="#FFF275"/>
    <circle cx="38" cy="58" r="6" fill="#FFF59D"/>
    <circle cx="49" cy="58" r="6" fill="#FFF275"/>
    <circle cx="59" cy="60" r="5.5" fill="#FFCA28"/>
    <!-- Row 5 -->
    <circle cx="30" cy="72" r="5" fill="#FFD54F"/>
    <circle cx="40" cy="70" r="5.5" fill="#FFD54F"/>
    <circle cx="50" cy="70" r="5.5" fill="#FFCA28"/>
    <circle cx="58" cy="72" r="5" fill="#FFB300"/>

    <!-- Shiny gloss line down the cob -->
    <path d="M 36,18 C 36,40 38,65 38,82" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- Tender Green Peeled Husks (Wrapping around base) -->
  <!-- Left Husk -->
  <path d="M 28,104 C 18,84 16,62 26,44 C 30,58 34,76 44,92 Z" fill="url(#corn_husk)" filter="url(#corn_shadow)"/>
  <path d="M 24,54 C 24,70 30,86 38,98" stroke="#D4FF96" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Right Husk -->
  <path d="M 72,106 C 88,88 94,66 84,48 C 82,62 76,80 62,94 Z" fill="url(#corn_husk)" filter="url(#corn_shadow)"/>
  <path d="M 84,58 C 82,72 74,86 64,98" stroke="#D4FF96" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Bottom Husk Stem / Stalk -->
  <ellipse cx="48" cy="106" rx="10" ry="6" fill="#3D820C" transform="rotate(-20 48 106)"/>
</svg>\n