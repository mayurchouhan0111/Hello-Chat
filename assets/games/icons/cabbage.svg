<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="cabbage_outer" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#84F250" />
      <stop offset="45%" stop-color="#4CB81D" />
      <stop offset="80%" stop-color="#28780A" />
      <stop offset="100%" stop-color="#144702" />
    </radialGradient>
    <radialGradient id="cabbage_inner" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#D7FFA8" />
      <stop offset="50%" stop-color="#A5F05B" />
      <stop offset="100%" stop-color="#56B818" />
    </radialGradient>
    <filter id="cabbage_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="64" cy="112" rx="46" ry="12" fill="#000000" opacity="0.28" filter="url(#cabbage_shadow)"/>

  <!-- Outer Layer Curly Leaves (Back) -->
  <path d="M 22,64 C 12,42 28,18 52,14 C 64,12 80,14 96,24 C 114,36 118,60 110,80 C 102,98 80,108 58,106 C 36,104 18,88 22,64 Z" fill="url(#cabbage_outer)" filter="url(#cabbage_shadow)"/>

  <!-- Left Wrap Leaf -->
  <path d="M 18,58 C 16,36 34,22 54,26 C 68,28 72,42 66,60 C 60,78 44,92 30,86 C 18,80 18,68 18,58 Z" fill="url(#cabbage_outer)"/>
  <!-- Leaf veins -->
  <path d="M 26,72 C 34,60 44,48 50,32" stroke="#B8FFA3" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 36,58 C 42,60 48,60 54,56" stroke="#B8FFA3" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 30,68 C 36,72 44,72 50,68" stroke="#B8FFA3" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Right Wrap Leaf -->
  <path d="M 108,54 C 112,34 94,20 74,22 C 60,24 54,38 60,56 C 66,74 84,88 98,82 C 108,76 106,64 108,54 Z" fill="url(#cabbage_outer)"/>
  <!-- Leaf veins -->
  <path d="M 100,70 C 92,58 82,46 76,30" stroke="#B8FFA3" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 90,56 C 84,58 78,58 72,54" stroke="#B8FFA3" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Crisp Tender Inner Leaf Heart -->
  <ellipse cx="64" cy="58" rx="26" ry="24" fill="url(#cabbage_inner)"/>
  <!-- Layered ruffles -->
  <path d="M 46,50 C 50,40 60,38 68,44 C 76,50 82,46 84,54 C 86,64 78,74 66,76 C 54,78 44,68 46,50 Z" fill="#E8FFCC" opacity="0.6"/>
  <path d="M 52,58 C 56,52 64,52 70,56 C 74,60 76,66 70,70 C 64,74 54,70 52,58 Z" fill="#FFFFFF" opacity="0.5"/>

  <!-- Fresh Dewy Water Drop Highlights -->
  <circle cx="48" cy="42" r="3" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="78" cy="38" r="2.5" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="62" cy="62" r="3.5" fill="#FFFFFF" opacity="0.9"/>
</svg>\n